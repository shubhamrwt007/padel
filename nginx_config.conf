# Nginx configuration for Swoot Deep Linking
# Save this as: /etc/nginx/sites-available/swootapp.com

server {
    listen 80;
    listen [::]:80;
    server_name swootapp.com www.swootapp.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name swootapp.com www.swootapp.com;

    # SSL Configuration
    # Update these paths with your actual SSL certificate paths
    ssl_certificate /etc/ssl/certs/swootapp.com.crt;
    ssl_certificate_key /etc/ssl/private/swootapp.com.key;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Root directory for web files
    root /var/www/swootapp.com;
    index index.html web_fallback.html;

    # Access and Error Logs
    access_log /var/log/nginx/swootapp_access.log;
    error_log /var/log/nginx/swootapp_error.log;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ============================================
    # iOS Universal Links Configuration
    # ============================================
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        
        # IMPORTANT: Replace TEAM_ID with your actual Apple Team ID
        # Get it from: https://developer.apple.com/account
        return 200 '{
            "applinks": {
                "apps": [],
                "details": [
                    {
                        "appID": "TEAM_ID.com.matchacha.app",
                        "paths": [
                            "*",
                            "/",
                            "/booking",
                            "/match",
                            "/open-match",
                            "/tournament",
                            "/league",
                            "/profile",
                            "/court",
                            "/wallet",
                            "/notifications",
                            "/leaderboard"
                        ]
                    }
                ]
            },
            "webcredentials": {
                "apps": [
                    "TEAM_ID.com.matchacha.app"
                ]
            }
        }';
    }

    # Alternative: Serve from file instead of inline JSON
    # Uncomment this and comment the above if you prefer file-based config
    # location = /.well-known/apple-app-site-association {
    #     alias /var/www/swootapp.com/.well-known/apple-app-site-association;
    #     default_type application/json;
    #     add_header Content-Type application/json;
    #     add_header Access-Control-Allow-Origin *;
    # }

    # ============================================
    # Android App Links Configuration
    # ============================================
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        
        # IMPORTANT: Replace YOUR_SHA256_FINGERPRINT with your actual SHA256
        # Get it by running: ./get_sha256.sh
        return 200 '[
            {
                "relation": ["delegate_permission/common.handle_all_urls"],
                "target": {
                    "namespace": "android_app",
                    "package_name": "com.matchacha.app",
                    "sha256_cert_fingerprints": [
                        "YOUR_RELEASE_SHA256_FINGERPRINT",
                        "YOUR_DEBUG_SHA256_FINGERPRINT"
                    ]
                }
            }
        ]';
    }

    # Alternative: Serve from file
    # location = /.well-known/assetlinks.json {
    #     alias /var/www/swootapp.com/.well-known/assetlinks.json;
    #     default_type application/json;
    #     add_header Content-Type application/json;
    #     add_header Access-Control-Allow-Origin *;
    # }

    # ============================================
    # Deep Link Routes with Fallback
    # ============================================
    
    # Main routes - serve fallback HTML when app is not installed
    location / {
        try_files $uri $uri/ /web_fallback.html;
    }

    # Specific routes for deep linking
    location ~ ^/(booking|match|open-match|tournament|league|profile|court|wallet|notifications|leaderboard) {
        try_files $uri /web_fallback.html;
    }

    # ============================================
    # Static Files
    # ============================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # Robots.txt and Sitemap
    # ============================================
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
    }

    # ============================================
    # Error Pages
    # ============================================
    error_page 404 /web_fallback.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================
# Rate Limiting (Optional but Recommended)
# ============================================
# Add this to the http block in /etc/nginx/nginx.conf
# limit_req_zone $binary_remote_addr zone=deeplink_limit:10m rate=10r/s;
# limit_req_status 429;

