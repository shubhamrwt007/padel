name: padel_mobile
description: "A new Flutter project."
publish_to: 'none'
#version: 1.0.16
version: 1.0.12+24

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get:
  uuid:
  get_storage:
  connectivity_plus:
  dio:
  http:
  logger:
  flutter_svg:
  pin_code_fields:
  flutter_rating_bar:
  easy_date_timeline:
  intl:
  flutter_map:
  latlong2:
  google_nav_bar:
  flutter_slidable:
  dropdown_search:
  image_picker:
  image_cropper:
  cached_network_image:
  razorpay_flutter: ^1.4.0
  flutter_local_notifications: ^17.0.0
  firebase_messaging:
  timezone:
  permission_handler:
  path_provider:
  device_info_plus:
  firebase_core:
  flutter_dash:
  shimmer:
  firebase_crashlytics:
  share_plus:
  flutter_zoom_drawer:
  loading_animation_widget:
  url_launcher:
  socket_io_client:
  flutter_cache_manager:
  carousel_slider:
  dashed_circular_progress_bar:
  fluttertoast:
  rolling_number_text:
  animate_do: ^3.3.4
  youtube_player_flutter: ^9.1.1
  sms_autofill:
  otp_autofill: ^4.1.0
  pretty_dio_logger:
  package_info_plus: ^9.0.0
  marquee_widget: ^1.2.0

dev_dependencies:
  flutter_launcher_icons:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/playstore.png"
  image_path: "assets/images/playstore.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie_files/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins/Poppins-Regular.ttf
          weight: 400

    - family: Lato
      fonts:
        - asset: fonts/Lato/Lato-Regular.ttf
          weight: 400
        - asset: fonts/Lato/Lato-Light.ttf
          weight: 500
        - asset: fonts/Lato/Lato-Bold.ttf
          weight: 700
